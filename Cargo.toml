[workspace]
resolver = "2"
members = [
    "crates/shbt-recon-core",
    "crates/shbt-recon-kernel",
    "crates/shbt-recon-thermo",
    "crates/shbt-recon-metrology",
    "crates/shbt-recon-eda",
    "crates/shbt-recon-cli",
    "crates/sglt-translocator-core",
    "crates/sglt-transducer-fea",
    "crates/sglt-hil-microkernel",
    "crates/sglt-lanr-power",
    "crates/sglt-metrology-causal",
    "crates/sglt-recon-deconv",
]

[package]
name = "shbt_recon"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]
default = []

[dependencies]
pyo3 = { version = "0.23" }
rug = { version = "1.24" }
gmp-mpfr-sys = { version = "1.7" }
