[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "shbt_recon"
version = "0.1.0"
description = "SHBT Destination Reconstruction & State Decoupling Simulator — Rust/PyO3 core"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.5.0", "numpy>=1.20.0"]

[project.scripts]
shbt-recon = "shbt_recon.cli:main"

[tool.maturin]
python-source = "python"
module-name = "shbt_recon._core"
features = ["extension-module"]
